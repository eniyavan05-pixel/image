<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>300 DPI JPG Batch Converter</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- JSZip for handling zip files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-6 text-slate-100 font-sans">

    <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 p-8 rounded-2xl shadow-2xl max-w-xl w-full">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <span class="bg-blue-500/15 text-blue-400 text-xs font-semibold px-3 py-1 rounded-full border border-blue-500/20">300 DPI JPG Export</span>
            <h1 class="text-2xl font-bold tracking-tight mt-3 text-white">Batch JPG Image Converter</h1>
            <p class="text-xs text-slate-400 mt-1">Convert images or ZIP archives to print-ready 300 DPI JPG format instantly.</p>
        </div>

        <!-- Uploader Zone -->
        <div class="mb-5">
            <label id="dropZone" class="relative flex flex-col items-center justify-center border-2 border-dashed border-slate-600 hover:border-blue-400 rounded-2xl p-8 cursor-pointer bg-slate-900/50 hover:bg-slate-900/80 transition-all duration-300 group shadow-inner">
                <div class="w-14 h-14 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center mb-3 group-hover:scale-105 group-hover:bg-blue-500/20 transition">
                    <svg class="w-7 h-7 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                    </svg>
                </div>
                <span id="uploadTitle" class="text-sm font-semibold text-slate-200">Drag & drop your images or ZIP here</span>
                <span id="uploadSubtitle" class="text-xs text-slate-400 mt-1">or <span class="text-blue-400 underline underline-offset-2">browse files</span> from your computer</span>
                <input type="file" id="fileInput" multiple accept="image/*,.zip" class="hidden"/>
            </label>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-3 mb-5">
            <button id="convertBtn" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] transition text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-blue-600/30 text-sm cursor-pointer disabled:bg-slate-700 disabled:text-slate-500 disabled:cursor-not-allowed" disabled>
                Start 300 DPI JPG Conversion
            </button>
            
            <a id="downloadBtn" class="hidden w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] transition text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-emerald-600/30 text-sm text-center block cursor-pointer">
                📥 Download Converted Folder (.zip)
            </a>
        </div>

        <!-- Progress Section -->
        <div id="progressContainer" class="hidden mb-5">
            <div class="flex justify-between text-xs text-slate-400 mb-1.5">
                <span id="progressText">Processing...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Terminal Output Log -->
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs text-emerald-400 h-32 overflow-y-auto shadow-inner" id="consoleLog">
            <span class="text-slate-500">// Uploader ready. Select images or ZIP file to begin...</span>
        </div>

    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadTitle = document.getElementById('uploadTitle');
        const uploadSubtitle = document.getElementById('uploadSubtitle');
        const convertBtn = document.getElementById('convertBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const consoleLog = document.getElementById('consoleLog');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const progressText = document.getElementById('progressText');

        let selectedFiles = [];

        fileInput.addEventListener('change', (e) => {
            selectedFiles = e.target.files;
            if (selectedFiles.length > 0) {
                convertBtn.disabled = false;
                downloadBtn.classList.add('hidden');
                uploadTitle.innerText = `${selectedFiles.length} item(s) selected`;
                uploadSubtitle.innerText = "Ready for 300 DPI JPG conversion";
                log(`Successfully loaded ${selectedFiles.length} selection(s).`);
            }
        });

        convertBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;
            
            convertBtn.disabled = true;
            downloadBtn.classList.add('hidden');
            progressContainer.classList.remove('hidden');
            log("Starting strict 300 DPI JPG batch conversion...");

            const outputZip = new JSZip();
            const outputFolder = outputZip.folder("converted_jpg_300dpi");
            let imageEntries = [];

            for (let file of selectedFiles) {
                if (file.name.toLowerCase().endsWith('.zip')) {
                    log(`📦 Extracting ZIP archive: ${file.name}`);
                    try {
                        const zipContent = await JSZip.loadAsync(file);
                        for (let relativePath in zipContent.files) {
                            const zipEntry = zipContent.files[relativePath];
                            if (!zipEntry.dir && /\.(png|jpg|jpeg|webp|bmp|tiff)$/i.test(relativePath)) {
                                const blob = await zipEntry.async("blob");
                                const fileName = relativePath.split('/').pop();
                                imageEntries.push({ name: fileName, blob: blob });
                            }
                        }
                    } catch (err) {
                        log(`[FAIL] Could not extract zip ${file.name}: ${err.message}`);
                    }
                } else if (/\.(png|jpg|jpeg|webp|bmp|tiff)$/i.test(file.name)) {
                    imageEntries.push({ name: file.name, blob: file });
                }
            }

            if (imageEntries.length === 0) {
                log("❌ No valid images found to convert.");
                convertBtn.disabled = false;
                return;
            }

            log(`🚀 Converting ${imageEntries.length} images to 300 DPI JPG...`);
            let processed = 0;

            for (let item of imageEntries) {
                try {
                    const dataUrl = await blobToDataURL(item.blob);
                    const jpgBlob = await convertTo300DPIJPG(dataUrl);
                    
                    const baseName = item.name.substring(0, item.name.lastIndexOf('.')) || item.name;
                    outputFolder.file(`${baseName}.jpg`, jpgBlob);
                    
                    processed++;
                    const pct = Math.round((processed / imageEntries.length) * 100);
                    progressBar.style.width = pct + '%';
                    progressPercent.innerText = pct + '%';
                    progressText.innerText = `Processed ${processed} of ${imageEntries.length} files`;
                    log(`[OK] Converted to JPG: ${item.name}`);
                } catch (err) {
                    log(`[FAIL] Error on ${item.name}: ${err.message}`);
                }
            }

            log("📦 Generating downloadable zip package...");
            const finalZipContent = await outputZip.generateAsync({ type: "blob" });
            const zipUrl = URL.createObjectURL(finalZipContent);
            
            downloadBtn.href = zipUrl;
            downloadBtn.download = "converted_300dpi_jpg.zip";
            downloadBtn.classList.remove('hidden');
            
            log("✨ Batch conversion complete! Click download below.");
            convertBtn.disabled = false;
        });

        function blobToDataURL(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
        }

        function convertTo300DPIJPG(dataUrl) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    
                    // Fill white background for transparent PNGs/WebPs converted to JPG
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    
                    // Export as high quality JPEG (0.92 quality)
                    canvas.toBlob(async (blob) => {
                        if (!blob) {
                            reject(new Error("Canvas conversion failed"));
                            return;
                        }
                        
                        // Inject 300 DPI JFIF header metadata into JPEG binary
                        const buffer = await blob.arrayBuffer();
                        const bytes = new Uint8Array(buffer);
                        const modifiedBytes = injectJPEGDPI(bytes, 300);
                        
                        resolve(new Blob([modifiedBytes], { type: 'image/jpeg' }));
                    }, 'image/jpeg', 0.92);
                };
                img.onerror = reject;
                img.src = dataUrl;
            });
        }

        // Helper to inject 300 DPI resolution into JPEG JFIF segment
        function injectJPEGDpi(bytes, dpi) {
            // Check for JFIF marker (FF E0 ... JFIF)
            if (bytes[0] === 0xFF && bytes[1] === 0xD8 && bytes[2] === 0xFF && bytes[3] === 0xE0) {
                // JFIF density units (offset 13): 1 = dots per inch
                bytes[13] = 1; 
                // X density (offset 14-15)
                bytes[14] = (dpi >> 8) & 0xFF;
                bytes[15] = dpi & 0xFF;
                // Y density (offset 16-17)
                bytes[16] = (dpi >> 8) & 0xFF;
                bytes[17] = dpi & 0xFF;
            }
            return bytes;
        }

        function log(message) {
            consoleLog.innerHTML += `<div class="mt-1">&gt; ${message}</div>`;
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }
    </script>
</body>
</html>
