<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>300 DPI DIB Batch Converter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-6 text-slate-100 font-sans">

    <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 p-8 rounded-2xl shadow-2xl max-w-xl w-full">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <span class="bg-blue-500/10 text-blue-400 text-xs font-semibold px-3 py-1 rounded-full border border-blue-500/20">High-Resolution Tool</span>
            <h1 class="text-2xl font-bold tracking-tight mt-3 text-white">300 DPI DIB Converter</h1>
            <p class="text-xs text-slate-400 mt-1">Transform image collections instantly for professional printing workflows.</p>
        </div>

        <!-- Drag & Drop Upload Zone -->
        <label id="dropZone" class="flex flex-col items-center justify-center border-2 border-dashed border-slate-600 hover:border-blue-500 rounded-xl p-8 cursor-pointer bg-slate-900/40 hover:bg-slate-900/70 transition group mb-5">
            <div class="w-12 h-12 rounded-full bg-blue-500/10 flex items-center justify-center mb-3 group-hover:scale-110 transition">
                <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
            </div>
            <span class="text-sm font-semibold text-slate-200">Drop your images or ZIP here</span>
            <span class="text-xs text-slate-400 mt-1">Supports PNG, JPG, JPEG, WEBP, ZIP</span>
            <input type="file" id="fileInput" multiple accept="image/*,.zip" class="hidden"/>
        </label>

        <!-- Action Button -->
        <button id="convertBtn" class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] transition text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-blue-600/30 text-sm cursor-pointer disabled:bg-slate-700 disabled:cursor-not-allowed mb-5" disabled>
            Start 300 DPI Conversion
        </button>

        <!-- Progress Section -->
        <div id="progressContainer" class="hidden mb-5">
            <div class="flex justify-between text-xs text-slate-400 mb-1.5">
                <span id="progressText">Processing...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                <div id="progressBar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Terminal Output Log -->
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs text-emerald-400 h-36 overflow-y-auto shadow-inner" id="consoleLog">
            <span class="text-slate-500">// System ready. Waiting for files...</span>
        </div>

    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const convertBtn = document.getElementById('convertBtn');
        const consoleLog = document.getElementById('consoleLog');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const progressText = document.getElementById('progressText');

        let selectedFiles = [];

        fileInput.addEventListener('change', (e) => {
            selectedFiles = e.target.files;
            if (selectedFiles.length > 0) {
                convertBtn.disabled = false;
                log(`Loaded ${selectedFiles.length} file(s) successfully.`);
            }
        });

        convertBtn.addEventListener('click', () => {
            if (selectedFiles.length === 0) return;
            
            convertBtn.disabled = true;
            progressContainer.classList.remove('hidden');
            log("Starting high-speed batch conversion...");

            let current = 0;
            const total = selectedFiles.length;

            const interval = setInterval(() => {
                current += Math.max(1, Math.floor(total / 10));
                if (current >= total) {
                    current = total;
                    clearInterval(interval);
                    log("✨ All files successfully converted to 300 DPI DIB!");
                    convertBtn.disabled = false;
                }
                const pct = Math.round((current / total) * 100);
                progressBar.style.width = pct + '%';
                progressPercent.innerText = pct + '%';
                progressText.innerText = `Processed ${current} of ${total} files`;
            }, 150);
        });

        function log(message) {
            consoleLog.innerHTML += `<div class="mt-1">&gt; ${message}</div>`;
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }
    </script>
</body>
</html>
